# qBittorrent pre-seed configuration
# ============================================================
# This file is read by qBittorrent on first startup. The
# linuxserver image init scripts will merge/update settings
# (e.g. WEBUI_PORT env var) without overwriting this file.
#
# The critical setting here is HostHeaderValidation.
# qBittorrent 4.6+ rejects WebUI requests where the Host
# header doesn't match its configured address. When behind
# Traefik, the Host header is your domain name, which causes
# a "Host header invalid" 403 error. Disabling this check is
# safe for a LAN-only homelab behind a trusted reverse proxy.
# ============================================================

[Preferences]
# Bind WebUI to all interfaces (required so Traefik can reach
# it via the gluetun container network namespace)
WebUI\Address=*

# Port must match WEBUI_PORT env var set in docker-compose.yml
WebUI\Port=8090

# Disable host header validation — safe behind a trusted
# LAN-only reverse proxy (Traefik)
WebUI\HostHeaderValidation=false

# Disable CSRF protection for reverse proxy compatibility
# (Traefik handles the HTTPS layer; CSRF adds no value here)
WebUI\CSRFProtection=false
