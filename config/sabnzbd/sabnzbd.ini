# SABnzbd pre-seed configuration
# ============================================================
# This file is read by SABnzbd on first startup. Missing keys
# are populated automatically — only the critical ones are set
# here to avoid issues before the web UI is accessible.
# ============================================================

[misc]
# host_whitelist controls which Host headers SABnzbd will accept.
# When behind a reverse proxy like Traefik, the Host header will
# be your domain (e.g. sabnzbd.home.yourdomain.com) rather than
# localhost. An empty value disables the check entirely, which is
# safe for a LAN-only homelab deployment.
host_whitelist =

# Bind to all interfaces so requests arriving via gluetun/Traefik
# are not rejected at the network level.
host = 0.0.0.0
port = 8080
