# =============================================================================
# ARR Homelab Media Stack
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # TRAEFIK — reverse proxy and SSL termination
  # Configured entirely via CLI args so Docker Compose can interpolate .env
  # variables (e.g. ${ACME_EMAIL}, ${BASE_DOMAIN}).
  # Cloudflare DNS-01 challenge issues Let's Encrypt certs without any open
  # internet ports — works perfectly for LAN-only deployments.
  #
  # qBittorrent and SABnzbd are routed via the gluetun container's labels
  # since they share its network namespace and aren't directly discoverable.
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.3
    container_name: traefik
    networks:
      - arrnet
    ports:
      - "80:80"
      - "443:443"
    command:
      # API / Dashboard
      - "--api.dashboard=true"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      # Docker provider — only expose containers with traefik.enable=true
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=arrnet"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      # Let's Encrypt via Cloudflare DNS-01 challenge
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      # Logging
      - "--log.level=INFO"
      - "--accesslog=true"
    environment:
      # Cloudflare API token — needs Zone:DNS:Edit permission for your domain
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${CONFIG_ROOT:-./config}/traefik/acme.json:/acme/acme.json
    labels:
      - "traefik.enable=true"
      # Traefik dashboard — protected by basic auth
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth@docker"
      # Basic auth middleware for the dashboard
      # Generate value with: htpasswd -nb admin yourpassword
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # GLUETUN — ProtonVPN WireGuard gateway
  # qBittorrent and SABnzbd share this container's network namespace.
  # All port mappings AND Traefik labels for those two services are here.
  # ---------------------------------------------------------------------------
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - arrnet
    ports:
      # Direct access fallback (bypass Traefik if needed)
      - "${SABNZBD_PORT:-8080}:8080"
      - "${QBIT_PORT:-8090}:8090"
      # qBittorrent torrent traffic (always direct, not proxied)
      - "${QBIT_TORRENT_PORT:-6881}:6881"
      - "${QBIT_TORRENT_PORT:-6881}:6881/udp"
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES:-Netherlands}
      - VPN_PORT_FORWARDING=${VPN_PORT_FORWARDING:-off}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/gluetun:/gluetun
    labels:
      - "traefik.enable=true"
      # --- qBittorrent ---
      # Traefik routes qbit.${BASE_DOMAIN} → gluetun:8090 (where qBit listens)
      - "traefik.http.routers.qbittorrent.rule=Host(`qbit.${BASE_DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls.certresolver=letsencrypt"
      - "traefik.http.routers.qbittorrent.service=qbittorrent-svc"
      - "traefik.http.services.qbittorrent-svc.loadbalancer.server.port=8090"
      # --- SABnzbd ---
      # Traefik routes sabnzbd.${BASE_DOMAIN} → gluetun:8080 (where SABnzbd listens)
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${BASE_DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls.certresolver=letsencrypt"
      - "traefik.http.routers.sabnzbd.service=sabnzbd-svc"
      - "traefik.http.services.sabnzbd-svc.loadbalancer.server.port=8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # QBITTORRENT — torrent client
  # Shares gluetun's network namespace — all torrent traffic goes through VPN.
  # WebUI port moved to 8090 (WEBUI_PORT) to avoid conflict with SABnzbd :8080.
  # Traefik labels live on the gluetun service above.
  # ---------------------------------------------------------------------------
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - WEBUI_PORT=8090
    volumes:
      - ${CONFIG_ROOT:-./config}/qbittorrent:/config
      - ${DATA_ROOT:-./data}/torrents:/data/torrents
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SABNZBD — Usenet/NZB client
  # Shares gluetun's network namespace — all Usenet traffic goes through VPN.
  # Linuxserver image hardcodes internal port :8080; published via gluetun.
  # Traefik labels live on the gluetun service above.
  # ---------------------------------------------------------------------------
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/sabnzbd:/config
      - ${DATA_ROOT:-./data}/usenet:/data/usenet
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # PROWLARR — indexer manager
  # ---------------------------------------------------------------------------
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - arrnet
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/prowlarr:/config
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${BASE_DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SONARR — TV show management
  # ---------------------------------------------------------------------------
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - arrnet
    depends_on:
      gluetun:
        condition: service_healthy
      prowlarr:
        condition: service_started
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/sonarr:/config
      - ${DATA_ROOT:-./data}:/data
    ports:
      - "${SONARR_PORT:-8989}:8989"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${BASE_DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # RADARR — movie management
  # ---------------------------------------------------------------------------
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    networks:
      - arrnet
    depends_on:
      gluetun:
        condition: service_healthy
      prowlarr:
        condition: service_started
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/radarr:/config
      - ${DATA_ROOT:-./data}:/data
    ports:
      - "${RADARR_PORT:-7878}:7878"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${BASE_DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LIDARR — music management
  # ---------------------------------------------------------------------------
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    networks:
      - arrnet
    depends_on:
      gluetun:
        condition: service_healthy
      prowlarr:
        condition: service_started
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${CONFIG_ROOT:-./config}/lidarr:/config
      - ${DATA_ROOT:-./data}:/data
    ports:
      - "${LIDARR_PORT:-8686}:8686"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${BASE_DOMAIN}`)"
      - "traefik.http.routers.lidarr.entrypoints=websecure"
      - "traefik.http.routers.lidarr.tls.certresolver=letsencrypt"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # JELLYFIN — media server
  # Reads finished media from data/media/. Not routed through VPN.
  # ---------------------------------------------------------------------------
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    networks:
      - arrnet
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/New_York}
      - JELLYFIN_PublishedServerUrl=https://jellyfin.${BASE_DOMAIN}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      - ${DATA_ROOT:-./data}/media:/data/media
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
      - "8920:8920"       # HTTPS (optional)
      - "7359:7359/udp"   # LAN auto-discovery
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyfin.${BASE_DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"
    restart: unless-stopped

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  arrnet:
    name: arrnet
    driver: bridge
